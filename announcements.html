<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1554a6">
  <title>大會公告｜2026 學童盃中區預賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-main">
    <header class="page-hero">
      <div class="page-hero-inner" data-reveal>
        <span class="page-kicker">ANNOUNCEMENTS</span>
        <h1>大會公告</h1>
      </div>
    </header>

    <section class="page-content">
      <div class="notice-list" data-announcements aria-live="polite">
        <p class="notice-state">公告載入中…</p>
      </div>
    </section>
  </main>
  <dialog id="south-schedule-dialog" class="schedule-dialog" aria-labelledby="south-schedule-title" aria-describedby="south-schedule-description">
    <div class="schedule-dialog-panel">
      <button class="schedule-dialog-close" type="button" aria-label="關閉選擇視窗">×</button>
      <span class="page-kicker">2026 SCHOOLBOY CUP · SOUTH REGION</span>
      <h2 id="south-schedule-title">南區預賽賽程</h2>
      <p id="south-schedule-description">請選擇參賽組別，開啟對應的完整賽程 PDF。</p>
      <div class="schedule-dialog-options">
        <a href="2026全國學童盃足球錦標賽南區預賽公開組_V1.pdf" type="application/pdf" target="_blank" rel="noopener noreferrer">
          <strong>公開組</strong>
          <span>查看南區公開組賽程 PDF <span aria-hidden="true">↗</span></span>
        </a>
        <a href="2026全國學童盃足球錦標賽南區預賽學校組_V1.pdf" type="application/pdf" target="_blank" rel="noopener noreferrer">
          <strong>學校組</strong>
          <span>查看南區學校組賽程 PDF <span aria-hidden="true">↗</span></span>
        </a>
      </div>
      <p class="schedule-dialog-note">賽程如有異動，請以大會後續正式公告為準。</p>
    </div>
  </dialog>
  <dialog id="east-schedule-dialog" class="schedule-dialog" aria-labelledby="east-schedule-title" aria-describedby="east-schedule-description">
    <div class="schedule-dialog-panel">
      <button class="schedule-dialog-close" type="button" aria-label="關閉東區賽程視窗">×</button>
      <span class="page-kicker">2026 SCHOOLBOY CUP · EAST REGION</span>
      <h2 id="east-schedule-title">東區預賽賽程</h2>
      <p id="east-schedule-description">請點擊下方按鈕，開啟完整的東區預賽賽程 PDF。</p>
      <div class="schedule-dialog-options schedule-dialog-options--single">
        <a href="2026全國學童盃足球錦標賽東區預賽.pdf" type="application/pdf" target="_blank" rel="noopener noreferrer">
          <strong>查看東區賽程</strong>
          <span>開啟完整賽程 PDF <span aria-hidden="true">↗</span></span>
        </a>
      </div>
      <p class="schedule-dialog-note">賽程如有異動，請以大會後續正式公告為準。</p>
    </div>
  </dialog>
  <script src="toolbar.js"></script>
  <script src="app.js"></script>
  <script src="announcements-data.js"></script>
  <script src="announcements.js"></script>
</body>
</html>
