<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1554a6">
  <title>即時比分｜2026 學童盃中區預賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-main">
    <header class="page-hero">
      <div class="page-hero-inner" data-reveal>
        <span class="page-kicker">LIVE SCORES</span>
        <h1>即時比分</h1>
      </div>
    </header>

    <section class="page-content">
      <div class="scores-shell">
        <div class="scores-waiting" data-score-waiting data-reveal>
          <div>
            <div class="waiting-icon" aria-hidden="true">⚽</div>
            <h2>等待大會公布</h2>
            <p>即時比分資料將於大會公布後提供。</p>
          </div>
        </div>

        <div data-score-app hidden>
          <div class="score-filter-panel">
            <div class="score-filter-step">
              <div class="score-filter-heading">
                <span class="score-filter-index">01</span>
                <div>
                  <small>GROUP</small>
                  <strong>選擇參賽組別</strong>
                </div>
              </div>
              <div class="score-choice-grid score-choice-grid-main" data-score-category>
                <button class="score-choice" type="button" data-category="school">
                  <span>學校組</span>
                  <small>SCHOOL</small>
                </button>
                <button class="score-choice" type="button" data-category="open">
                  <span>公開組</span>
                  <small>OPEN</small>
                </button>
              </div>
            </div>

            <div class="score-filter-step score-filter-age" data-score-age-step hidden>
              <div class="score-filter-heading">
                <span class="score-filter-index">02</span>
                <div>
                  <small>GRADE</small>
                  <strong>選擇歲組</strong>
                </div>
              </div>
              <div class="score-choice-grid score-choice-grid-age" data-score-age>
                <button class="score-choice" type="button" data-age="4"><span>四年級</span><small>GRADE 4</small></button>
                <button class="score-choice" type="button" data-age="5"><span>五年級</span><small>GRADE 5</small></button>
                <button class="score-choice" type="button" data-age="6"><span>六年級</span><small>GRADE 6</small></button>
              </div>
            </div>

            <div class="score-filter-status">
              <strong data-score-current>請先選擇參賽組別</strong>
              <span class="score-updated" data-score-updated></span>
            </div>
          </div>
          <div class="score-output" data-score-output></div>
        </div>
      </div>
    </section>
  </main>
  <script src="toolbar.js"></script>
  <script src="app.js"></script>
  <script src="live-scores.js"></script>
</body>
</html>
