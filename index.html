<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="2026 全國學童盃足球錦標賽中區預賽賽事資訊">
  <meta name="theme-color" content="#1554a6">
  <title>2026 全國學童盃足球錦標賽｜中區預賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-main">
    <section class="home-hero">
      <div class="poster-stage" data-parallax data-reveal>
        <img src="主視覺.png" alt="2026 全國學童盃足球錦標賽中區主視覺">
        <div class="poster-sheen" aria-hidden="true"></div>
      </div>
    </section>

    <section class="countdown-section">
      <div class="countdown-panel" data-countdown-target="2026-10-17T00:00:00+08:00" data-reveal>
        <div class="countdown-header">
          <strong>COUNTDOWN TO KICKOFF</strong>
          <p class="countdown-caption">距離 10 月 17 日中區預賽首日</p>
        </div>
        <div class="countdown-grid" aria-label="賽事倒數">
          <div class="countdown-item" data-count-unit-name="days">
            <span class="count-digits" aria-label="天">
              <span class="count-digit" data-count-digit="days-tens">0</span>
              <span class="count-digit" data-count-digit="days-ones">0</span>
            </span>
            <small>天 DAYS</small>
          </div>
          <div class="countdown-item" data-count-unit-name="hours">
            <span class="count-digits" aria-label="小時">
              <span class="count-digit" data-count-digit="hours-tens">0</span>
              <span class="count-digit" data-count-digit="hours-ones">0</span>
            </span>
            <small>小時 HOURS</small>
          </div>
          <div class="countdown-item" data-count-unit-name="minutes">
            <span class="count-digits" aria-label="分鐘">
              <span class="count-digit" data-count-digit="minutes-tens">0</span>
              <span class="count-digit" data-count-digit="minutes-ones">0</span>
            </span>
            <small>分鐘 MINUTES</small>
          </div>
          <div class="countdown-item" data-count-unit-name="seconds">
            <span class="count-digits" aria-label="秒">
              <span class="count-digit" data-count-digit="seconds-tens">0</span>
              <span class="count-digit" data-count-digit="seconds-ones">0</span>
            </span>
            <small>秒 SECONDS</small>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="toolbar.js"></script>
  <script src="app.js"></script>
</body>
</html>
