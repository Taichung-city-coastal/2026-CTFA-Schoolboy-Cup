<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1554a6">
  <title>大會公告｜2026 學童盃中區預賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-main">
    <header class="page-hero">
      <div class="page-hero-inner" data-reveal>
        <span class="page-kicker">ANNOUNCEMENTS</span>
        <h1>大會公告</h1>
      </div>
    </header>

    <section class="page-content">
      <figure class="promo-banner" data-tilt data-reveal>
        <img src="學童盃banner.jpg" alt="2026 全國學童盃足球錦標賽中區準備開打活動 Banner">
      </figure>
      <div class="notice-list">
        <article class="notice-card" data-reveal>
          <time datetime="2026-09-23">2026.09.23</time>
          <div>
            <span class="status-pill">最新公告</span>
            <h2>2026 全國學童盃足球錦標賽競賽規程（草案）暨報名資訊公告</h2>
            <p>包含分區、日期、場地、報名方式、組別與參賽資格。</p>
          </div>
          <a href="https://www.ctfa.com.tw/index.php?Itemid=7675&id=8489&option=com_content&view=article" target="_blank" rel="noopener noreferrer">官方公告 ↗</a>
        </article>
        <article class="notice-card" data-reveal data-reveal-delay="80">
          <time>待公告</time>
          <div>
            <span class="status-pill">待公告</span>
            <h2>中區預賽完整賽程與分組</h2>
            <p>正式賽程與分組以大會公告為準。</p>
          </div>
          <a href="live-scores.html">比分頁 ↗</a>
        </article>
        <article class="notice-card" data-reveal data-reveal-delay="160">
          <time>待公告</time>
          <div>
            <span class="status-pill">待公告</span>
            <h2>場地配置與賽事注意事項</h2>
            <p>各組實際比賽場地與報到資訊以大會公告為準。</p>
          </div>
          <a href="venue-map.html">場地頁 ↗</a>
        </article>
      </div>
    </section>
  </main>
  <script src="toolbar.js"></script>
  <script src="app.js"></script>
</body>
</html>
