<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1554a6">
  <title>比賽場地｜2026 學童盃中區預賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site-main">
    <header class="page-hero">
      <div class="page-hero-inner" data-reveal>
        <span class="page-kicker">VENUES</span>
        <h1>比賽場地</h1>
      </div>
    </header>

    <section class="page-content">
      <div class="venue-grid">
        <article class="venue-card" data-reveal>
          <div class="venue-map-embed">
            <iframe
              src="https://www.google.com/maps?q=%E8%87%BA%E4%B8%AD%E5%B8%82%E6%9C%9D%E9%A6%AC%E8%B6%B3%E7%90%83%E5%A0%B4&output=embed"
              title="臺中市朝馬足球場 Google Maps"
              loading="lazy"
              allowfullscreen
              referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <div class="venue-card-body">
            <span>臺中市西屯區</span>
            <h2>臺中市朝馬足球場</h2>
            <address>407 臺中市西屯區朝馬路 145 號</address>
            <a href="https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E4%B8%AD%E5%B8%82%E6%9C%9D%E9%A6%AC%E8%B6%B3%E7%90%83%E5%A0%B4" target="_blank" rel="noopener noreferrer">開啟 Google Maps ↗</a>
          </div>
        </article>
        <article class="venue-card" data-reveal data-reveal-delay="100">
          <div class="venue-map-embed">
            <iframe
              src="https://www.google.com/maps?q=%E8%87%BA%E4%B8%AD%E5%B8%82%E7%AB%8B%E6%BD%AD%E7%A7%80%E5%9C%8B%E6%B0%91%E4%B8%AD%E5%AD%B8&output=embed"
              title="臺中市立潭秀國民中學 Google Maps"
              loading="lazy"
              allowfullscreen
              referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          <div class="venue-card-body">
            <span>臺中市潭子區</span>
            <h2>臺中市立潭秀國民中學</h2>
            <address>427 臺中市潭子區雅潭路一段 175 號</address>
            <a href="https://www.google.com/maps/search/?api=1&query=%E8%87%BA%E4%B8%AD%E5%B8%82%E7%AB%8B%E6%BD%AD%E7%A7%80%E5%9C%8B%E6%B0%91%E4%B8%AD%E5%AD%B8" target="_blank" rel="noopener noreferrer">開啟 Google Maps ↗</a>
          </div>
        </article>
      </div>
      <p class="venue-note">各組實際使用場地與報到資訊以大會公告為準。</p>
    </section>
  </main>
  <script src="toolbar.js"></script>
  <script src="app.js"></script>
</body>
</html>
